name: Deploy backend container to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest

  build:
    name: Build and publish container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate production configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B59C496BB1704620AFEB082C578133A9 }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_6482AAF165B249D0AF8F3E2FED23F896 }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5BDDA8BC43B46808B5ABBC85F0E702C }}
        run: |
          : "${AZURE_WEBAPP_NAME:?Define AZURE_WEBAPP_NAME in the production environment}"
          : "${AZURE_RESOURCE_GROUP:?Define AZURE_RESOURCE_GROUP in the production environment}"
          : "${BACKEND_PUBLIC_URL:?Define BACKEND_PUBLIC_URL in the production environment}"
          : "${GHCR_PULL_TOKEN:?Define GHCR_PULL_TOKEN in the production environment}"
          : "${AZURE_CLIENT_ID:?Define AZURE_CLIENT_ID in the production environment}"
          : "${AZURE_TENANT_ID:?Define AZURE_TENANT_ID in the production environment}"
          : "${AZURE_SUBSCRIPTION_ID:?Define AZURE_SUBSCRIPTION_ID in the production environment}"
          case "$BACKEND_PUBLIC_URL" in
            https://*) ;;
            *) echo "BACKEND_PUBLIC_URL must use HTTPS" >&2; exit 1 ;;
          esac

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B59C496BB1704620AFEB082C578133A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6482AAF165B249D0AF8F3E2FED23F896 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5BDDA8BC43B46808B5ABBC85F0E702C }}

      - name: Verify runtime authentication configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          SECURITY_SETTINGS_JSON="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "[?name=='JWT_ISSUER' || name=='JWT_AUDIENCE'].{name:name,value:value}" \
            --output json)"
          export SECURITY_SETTINGS_JSON
          python3 - <<'PY'
          import json
          import os

          settings = {item['name']: item['value'] for item in json.loads(os.environ['SECURITY_SETTINGS_JSON'])}
          missing = [name for name in ('JWT_ISSUER', 'JWT_AUDIENCE') if not (settings.get(name) or '').strip()]
          if missing:
              print('::error::Missing App Service runtime settings: ' + ', '.join(missing))
              print('Configure these in Azure Web App > Environment variables, not only in GitHub.')
              raise SystemExit(1)
          print('Required runtime authentication settings are configured; values omitted.')
          PY

      - name: Configure private registry and container port
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.repository_owner }}
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings WEBSITES_PORT=8000 \
            --output none
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" \
            --container-registry-url "https://$REGISTRY" \
            --container-registry-user "$GHCR_PULL_USERNAME" \
            --container-registry-password "$GHCR_PULL_TOKEN" \
            --output none

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify production health
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --retry 18 --retry-all-errors --retry-delay 10 \
            "${base_url}/health"

      - name: Verify protected endpoints reject anonymous requests
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          for attempt in {1..12}; do
            ready=true
            # Check the new embed route first to avoid loading Gold in the old container.
            for path in /embed/reclamos /analytics/residuos; do
              status_code="$(curl --silent --show-error --output /dev/null \
                --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache' \
                --write-out '%{http_code}' "${base_url}${path}")" || status_code='transport-error'
              if [[ "$status_code" != '401' ]]; then
                echo "Attempt ${attempt}/12: expected HTTP 401 without a token at ${path}; received ${status_code}" >&2
                ready=false
                break
              fi
            done
            if [[ "$ready" == 'true' ]]; then
              echo 'Both protected endpoints reject anonymous requests with HTTP 401.'
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 10; fi
          done
          echo 'Protected endpoints did not become ready. Check the container startup logs and runtime configuration in Azure.' >&2
          exit 1

      - name: Log out from Azure
        if: always()
        run: az logout
