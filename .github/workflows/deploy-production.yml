name: Deploy backend to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  quality:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest

      - name: Build production container
        run: docker build --target production --tag citypass-backend:production-check .

  deploy:
    name: Deploy backend
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate production configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${AZURE_WEBAPP_NAME:?Define AZURE_WEBAPP_NAME in the production environment}"
          : "${BACKEND_PUBLIC_URL:?Define BACKEND_PUBLIC_URL in the production environment}"
          : "${AZURE_CLIENT_ID:?Define AZURE_CLIENT_ID in the production environment}"
          : "${AZURE_TENANT_ID:?Define AZURE_TENANT_ID in the production environment}"
          : "${AZURE_SUBSCRIPTION_ID:?Define AZURE_SUBSCRIPTION_ID in the production environment}"
          case "$BACKEND_PUBLIC_URL" in
            https://*) ;;
            *) echo "BACKEND_PUBLIC_URL must use HTTPS" >&2; exit 1 ;;
          esac

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy source to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .

      - name: Verify production health
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base_url}/health"

      - name: Verify production Gold connection
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error --output /dev/null \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${base_url}/analytics/residuos"
