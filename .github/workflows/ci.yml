name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production container
        run: docker build --target production --tag citypass-plus-analytics-backend:ci .

      - name: Run production container smoke test
        run: |
          docker run --detach --name analytics-api-ci --publish 8000:8000 \
            citypass-plus-analytics-backend:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/

      - name: Remove production test container
        if: always()
        run: docker rm --force analytics-api-ci || true
