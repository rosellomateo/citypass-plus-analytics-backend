name: Build and deploy backend container to Azure Web App - test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AZURE_WEBAPP_NAME: rg-citypass-backend-test
  AZURE_RESOURCE_GROUP: rg-citypass-backend-test
  BACKEND_PUBLIC_URL: https://rg-citypass-backend-test-g0hdacdxccbdb6g5.brazilsouth-01.azurewebsites.net

jobs:
  quality:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest

  build:
    name: Build and publish container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy test container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment secrets
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B59C496BB1704620AFEB082C578133A9 }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_6482AAF165B249D0AF8F3E2FED23F896 }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5BDDA8BC43B46808B5ABBC85F0E702C }}
        run: |
          : "${GHCR_PULL_TOKEN:?Define GHCR_PULL_TOKEN as a repository secret}"
          : "${AZURE_CLIENT_ID:?Azure client ID secret is missing}"
          : "${AZURE_TENANT_ID:?Azure tenant ID secret is missing}"
          : "${AZURE_SUBSCRIPTION_ID:?Azure subscription ID secret is missing}"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B59C496BB1704620AFEB082C578133A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6482AAF165B249D0AF8F3E2FED23F896 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5BDDA8BC43B46808B5ABBC85F0E702C }}

      - name: Configure private registry and container port
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.repository_owner }}
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings WEBSITES_PORT=8000 \
            --output none
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE_NAME:$GITHUB_SHA" \
            --container-registry-url "https://$REGISTRY" \
            --container-registry-user "$GHCR_PULL_USERNAME" \
            --container-registry-password "$GHCR_PULL_TOKEN" \
            --output none

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify test health
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            "${base_url}/health"

      - name: Verify test Gold connection
        run: |
          base_url="${BACKEND_PUBLIC_URL%/}"
          curl --fail --silent --show-error --output /dev/null \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "${base_url}/analytics/residuos"
